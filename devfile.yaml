  - name: ramalama
    attributes:
      container-overrides:
        resources:
          limits:
            cpu: 4000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 4Gi
    container:
      image: quay.io/ramalama/ramalama:latest      # era :0.7
      args:
        - "ramalama"
        - "--store"
        - "/models"
        - "serve"
        - "--network=none"
        - "ollama://gemma3:4b"                     # era granite-code:latest
      volumeMounts:
        - name: ramalama-models
          path: /models
      endpoints:
        - exposure: public
          name: ramalamaserve
          protocol: http
          targetPort: 8080