name: Local Assistant
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5-Coder 3B
    provider: llama.cpp
    model: default
    apiBase: http://localhost:8080
    roles:
      - chat
      - edit
      - apply
      - autocomplete
    defaultCompletionOptions:
      temperature: 0.2

rules:
  - Responda sempre em português do Brasil.
  - Gere código Python completo e executável, com bloco if __name__ == "__main__".
  - Garanta que o formato de entrada pedido ao usuário seja o mesmo usado no parsing.
  - Inclua exemplos de entrada válida e inválida em comentários.

allowAnonymousTelemetry: false

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase

